name: Playwright E2E Banking Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Chromium only in CI to stay within the public ParaBank sandbox's rate limit.
      # Firefox and WebKit projects remain available locally: npx playwright test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests (Chromium)
        run: npx playwright test --project=Chromium

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14
